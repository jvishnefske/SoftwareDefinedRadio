name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path firmware/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Clippy (std)
        run: cargo clippy --manifest-path firmware/Cargo.toml --no-default-features --features std --target x86_64-unknown-linux-gnu

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Run tests
        run: cargo test --manifest-path firmware/Cargo.toml --no-default-features --features std --target x86_64-unknown-linux-gnu

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same host (std) test set as the Test job. Threshold sits just below the
      # measured baseline (89.6% lines) so coverage can't silently regress.
      - name: Coverage (std)
        run: cargo llvm-cov --manifest-path firmware/Cargo.toml --no-default-features --features std --target x86_64-unknown-linux-gnu --lcov --output-path lcov.info --fail-under-lines 89
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --manifest-path firmware/Cargo.toml --target x86_64-unknown-linux-gnu --summary-only
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: firmware/Cargo.toml

  build-embedded:
    name: Build (Embedded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Build release
        run: cargo build --manifest-path firmware/Cargo.toml --release --target thumbv7em-none-eabihf
